name: Propose a new theme
description: Propose a new word set for an existing game
title: "[Theme]: "
body:
  - type: markdown
    attributes:
      value: |
        Read docs/adding-a-theme.md first. The list must be an original selection, not a copy of someone else's commercial word set.
  - type: input
    id: game
    attributes:
      label: Which game is this theme for?
      placeholder: Spy
    validations:
      required: true
  - type: input
    id: theme_name
    attributes:
      label: Theme name
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and boundaries
      description: Which groups and concepts will it include, and what will it intentionally exclude?
    validations:
      required: true
  - type: dropdown
    id: sensitive
    attributes:
      label: Does this theme contain sensitive content?
      description: For example, politics, drugs, violence, or adult content.
      options:
        - "No"
        - "Yes"
        - Not sure
    validations:
      required: true
  - type: textarea
    id: rights
    attributes:
      label: Origin and rights
      description: How was the list created? Were third-party sources used, and do their terms allow the material to be included?
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Confirmations
      options:
        - label: I have read docs/adding-a-theme.md and CONTRIBUTING.md.
          required: true
        - label: This is my original selection, not a copy of a paid or closed-source word set.
          required: true
        - label: I am prepared to add or update the catalog tests.
          required: true
