name: Suggest an improvement
description: Propose an interface, architecture, accessibility, or platform improvement
title: "[Idea]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem should we solve?
      description: Describe the use case and the current limitation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should change for players or contributors?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and trade-offs
      description: What alternatives did you consider, and what trade-offs do they involve?
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I have checked that no similar issue is already open.
          required: true
        - label: This proposal contains no secrets or personal data.
          required: true
