name: Propose a new game
description: Propose an independent game module for the collection
title: "[Game]: "
body:
  - type: markdown
    attributes:
      value: |
        Read docs/adding-a-game.md first. This issue helps us agree on the rules and module boundaries before implementation begins.
  - type: input
    id: game_name
    attributes:
      label: Game name
    validations:
      required: true
  - type: textarea
    id: pitch
    attributes:
      label: Short pitch
      description: Who is the game for, and how does it differ from the games already available?
    validations:
      required: true
  - type: textarea
    id: rules
    attributes:
      label: Rules and game loop
      description: Describe setup, turns, the end of the game, and win conditions.
    validations:
      required: true
  - type: input
    id: players
    attributes:
      label: Player count
      placeholder: 3–12
    validations:
      required: true
  - type: dropdown
    id: pass_and_play
    attributes:
      label: Does the game work as local pass-and-play without a server?
      options:
        - "Yes"
        - "No"
        - Not sure yet
    validations:
      required: true
  - type: textarea
    id: architecture
    attributes:
      label: Proposed module structure
      description: What will the domain, state/storage, UI, and platform integration points look like?
    validations:
      required: true
  - type: textarea
    id: content
    attributes:
      label: Content and rights
      description: What copy, data sets, and assets are required, who created them, and under what terms are they available?
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Confirmations
      options:
        - label: I have read docs/adding-a-game.md and CONTRIBUTING.md.
          required: true
        - label: I will not copy material from paid or closed-source games.
          required: true
