name: Report a bug
description: Report a reproducible problem in the interface, game rules, or data
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. For security vulnerabilities, follow SECURITY.md instead of disclosing details here.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the actual behavior and what you expected instead.
      placeholder: I expected..., but instead...
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How can we reproduce it?
      description: List the shortest sequence of steps that reproduces the problem.
      placeholder: |
        1. Open...
        2. Select...
        3. Tap...
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Device and browser
      placeholder: iPhone 15, iOS 19, Safari
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Additional context
      description: Add screenshots, recordings, or logs without secrets or personal data.
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I have checked that no similar issue is already open.
          required: true
        - label: This report does not disclose a security vulnerability.
          required: true
